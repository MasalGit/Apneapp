<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apneapp - Kaavio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="src/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="src/js/language.js"></script>

  <style>
    .graph-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin: 20px;
      border: 1px solid #e5e7eb;
    }

    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .graph-header h2 {
      margin: 0;
      font-size: 20px;
      color: #1e293b;
    }

    .graph-period {
      display: flex;
      gap: 10px;
    }

    .graph-period button {
      padding: 8px 16px;
      border: 1px solid #e2e8f0;
      background: white;
      color: #0f172a;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .graph-period button.active {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    .graph-period button:hover {
      border-color: #0f172a;
    }

    canvas {
      max-height: 400px;
    }

    body.dark-mode .graph-container {
      background: #1f2937;
      border-color: #374151;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    body.dark-mode .graph-header h2 {
      color: #f9fafb;
    }

    body.dark-mode .graph-period button {
      background: #111827;
      color: #d1d5db;
      border-color: #374151;
    }

    body.dark-mode .graph-period button.active {
      background: #60a5fa;
      color: #0f172a;
      border-color: #60a5fa;
    }

    body.dark-mode .graph-user-name {
      color: #f9fafb !important;
    }

    body.dark-mode .graph-user-status {
      color: #d1d5db !important;
    }
  </style>
</head>

<body class="db-body">
<script>
  if (localStorage.getItem("apneapp-theme") === "dark") {
    document.body.classList.add("dark-mode");
  }
</script>

  <aside class="db-sidebar">
    <div class="db-sidebar-logo">
      <i class="fas fa-lungs"></i>
      <span>Apneapp</span>
    </div>

    <nav class="db-nav">
      <a href="dashboard.html" class="db-nav-item">
        <i class="fas fa-th-large"></i>
        <span data-i18n="sidebarDashboard">Yleiskatsaus</span>
      </a>
      <a href="graph.html" class="db-nav-item active">
        <i class="fas fa-chart-line"></i>
        <span data-i18n="chart">Kaavio</span>
      </a>
      <a href="raportit.html" class="db-nav-item">
        <i class="fas fa-file-medical"></i>
        <span data-i18n="reports">Raportit</span>
      </a>
      <a href="asetukset.html" class="db-nav-item">
        <i class="fas fa-cog"></i>
        <span data-i18n="settings">Asetukset</span>
      </a>
    </nav>

    <button class="db-logout" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span data-i18n="logout">Kirjaudu ulos</span>
    </button>
  </aside>

  <main class="db-main">
    <header class="db-topbar">
      <div>
        <h1 data-i18n="chart">Kaavio</h1>
        <p class="db-date" id="dbDate"></p>
      </div>

      <div class="db-user">
        <div class="db-avatar"><i class="fas fa-user"></i></div>
        <div>
          <p class="graph-user-name" style="margin: 0; font-weight: 500; color: #1e293b;" data-i18n="user">Käyttäjä</p>
          <p class="graph-user-status" style="margin: 0; font-size: 12px; color: #94a3b8;" data-i18n="active">Aktiivinen</p>
        </div>
      </div>
    </header>

    <div class="graph-container">
      <div class="graph-header">
        <h2 data-i18n="sleepDurationRisk">Unen kesto ja Riskiarvio</h2>
        <div class="graph-period">
          <button data-i18n="7d">7 pv</button>
          <button data-i18n="30d">30 pv</button>
          <button data-i18n="90d">90 pv</button>
        </div>
      </div>
      <canvas id="sleepRiskChart"></canvas>
    </div>
  </main>

  <script src="script.js"></script>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:3000/api';

    const isDarkMode = localStorage.getItem("apneapp-theme") === "dark";
    const chartTextColor = isDarkMode ? "#d1d5db" : "#64748b";
    const chartGridColor = isDarkMode ? "#374151" : "#e2e8f0";

    const d = new Date();
    document.getElementById("dbDate").textContent =
      d.toLocaleDateString("fi-FI", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

    async function fetchSleepHours() {
      try {
        const token = localStorage.getItem('token');

        const response = await fetch(`${API_BASE_URL}/sleep/hours`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText}`);
        }

        return await response.json();
      } catch (error) {
        console.error('Error fetching sleep hours:', error);
        return [];
      }
    }

    async function fetchSleepQuality() {
      try {
        const token = localStorage.getItem('token');

        const response = await fetch(`${API_BASE_URL}/sleep/quality`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText}`);
        }

        return await response.json();
      } catch (error) {
        console.error('Error fetching sleep quality:', error);
        return [];
      }
    }

    function calculateRiskFromQuality(quality) {
      return Math.round((3 - quality) * 50);
    }

    function processData(hoursData, qualityData, days) {
      hoursData.sort((a, b) => new Date(b.date) - new Date(a.date));
      qualityData.sort((a, b) => new Date(b.date) - new Date(a.date));

      const recentHours = hoursData.slice(0, days).reverse();
      const recentQuality = qualityData.slice(0, days).reverse();

      const labels = recentHours.map(item => {
        const date = new Date(item.date);
        return date.toLocaleDateString("fi-FI", {
          month: "short",
          day: "numeric"
        });
      });

      const sleepHours = recentHours.map(item => item.hours);
      const riskScores = recentQuality.map(item => calculateRiskFromQuality(item.quality));

      return { labels, sleepHours, riskScores };
    }

    let hoursData = [];
    let qualityData = [];

    async function initializeChart() {
      hoursData = await fetchSleepHours();
      qualityData = await fetchSleepQuality();
      updateChart(7);
    }

    function updateChart(days) {
      const { labels, sleepHours, riskScores } = processData(hoursData, qualityData, days);

      if (window.chart) {
        window.chart.data.labels = labels;
        window.chart.data.datasets[0].data = sleepHours;
        window.chart.data.datasets[1].data = riskScores;
        window.chart.update();
        return;
      }

      const ctx = document.getElementById("sleepRiskChart").getContext("2d");

      window.chart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Unen kesto (h)",
              data: sleepHours,
              backgroundColor: "rgba(34, 197, 94, 0.7)",
              borderColor: "#22c55e",
              borderWidth: 0,
              borderRadius: 6,
              yAxisID: "y",
              order: 2
            },
            {
              label: "Riskiarvio",
              data: riskScores,
              type: "line",
              borderColor: "#ef4444",
              backgroundColor: "rgba(239, 68, 68, 0.12)",
              borderWidth: 3,
              fill: true,
              tension: 0.4,
              pointRadius: 6,
              pointBackgroundColor: "#ef4444",
              pointBorderColor: isDarkMode ? "#1f2937" : "#fff",
              pointBorderWidth: 2,
              pointHoverRadius: 8,
              yAxisID: "y1",
              order: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              display: true,
              labels: {
                color: chartTextColor,
                font: { size: 14 },
                padding: 15
              }
            }
          },
          scales: {
            y: {
              type: "linear",
              display: true,
              position: "left",
              title: {
                display: true,
                text: "Unen kesto (tuntia)",
                color: chartTextColor
              },
              ticks: {
                color: chartTextColor,
                font: { size: 12 }
              },
              grid: { color: chartGridColor },
              min: 0,
              max: 12
            },
            y1: {
              type: "linear",
              display: true,
              position: "right",
              title: {
                display: true,
                text: "Riskiarvio",
                color: chartTextColor
              },
              ticks: {
                color: chartTextColor,
                font: { size: 12 }
              },
              grid: { display: false },
              min: 0,
              max: 100
            },
            x: {
              ticks: {
                color: chartTextColor,
                font: { size: 12 }
              },
              grid: { display: false }
            }
          }
        }
      });
    }

    initializeChart();

    document.querySelectorAll(".graph-period button").forEach(btn => {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".graph-period button").forEach(b => b.classList.remove("active"));
        this.classList.add("active");

        const period = this.dataset.period;
        let days = 7;

        if (period === "30d") days = 30;
        if (period === "90d") days = 90;

        updateChart(days);
      });
    });
  </script>
</body>
</html>
