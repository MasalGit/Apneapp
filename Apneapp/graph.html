<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apneapp - Kaavio</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="src/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .graph-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin: 20px;
    }

    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .graph-period {
      display: flex;
      gap: 10px;
    }

    .graph-period button {
      padding: 8px 16px;
      border: 1px solid #e2e8f0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .graph-period button.active {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    canvas {
      max-height: 400px;
    }
  </style>
</head>

<body class="db-body">

<!-- SIDEBAR -->
  <aside class="db-sidebar">
    <div class="db-sidebar-logo">
      <i class="fas fa-lungs"></i>
      <span>Apneapp</span>
    </div>
    <nav class="db-nav">
      <a href="dashboard.html" class="db-nav-item">
        <i class="fas fa-th-large"></i>
        <span>Yleiskatsaus</span>
      </a>
      <a href="graph.html" class="db-nav-item active">
        <i class="fas fa-chart-line"></i>
        <span>Kaavio</span>
      </a>
      <a href="report.html" class="db-nav-item">
        <i class="fas fa-file-alt"></i>
        <span>Raportti</span>
      </a>
    </nav>
    <button class="db-logout" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span>Kirjaudu ulos</span>
    </button>
  </aside>

</aside>

<main class="db-main">

  <header class="db-topbar">
    <div>
      <h1>Kaavio</h1>
      <p id="dbDate"></p>
    </div>
  </header>

  <div class="graph-container">
    <div class="graph-header">
      <h2>Unen kesto ja LF/HF</h2>

      <div class="graph-period">
        <button class="active" data-period="7d">7 pv</button>
        <button data-period="30d">30 pv</button>
        <button data-period="90d">90 pv</button>
        <button data-period="365d">365 pv</button>
      </div>
    </div>

    <canvas id="sleepRiskChart"></canvas>
  </div>

</main>

<script>
const API_BASE_URL = 'http://127.0.0.1:3000/api';

document.getElementById("dbDate").textContent =
  new Date().toLocaleDateString("fi-FI", {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  });

async function fetchMeasurements(days = 7) {
  const token = localStorage.getItem('token');

  const res = await fetch(`${API_BASE_URL}/measurements?days=${days}`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  if (!res.ok) return [];
  return await res.json();
}

function getColor(v) {
  if (v < 0.6) return "#22c55e";
  if (v < 1.2) return "#facc15";
  return "#ef4444";
}

function processData(data, days) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);

  const filtered = data
    .filter(d => new Date(d.date) >= cutoff)
    .sort((a,b) => new Date(a.date) - new Date(b.date));

  return {
    labels: filtered.map(d =>
      new Date(d.date).toLocaleDateString("fi-FI", { month:"short", day:"numeric" })
    ),
    sleep: filtered.map(d => d.hours),
    lfhf: filtered.map(d => d.lfhf)
  };
}

let chart;
let dataCache = [];

async function init() {
  dataCache = await fetchMeasurements(365);
  updateChart(7);
}

function updateChart(days) {
  const { labels, sleep, lfhf } = processData(dataCache, days);

  if (chart) chart.destroy();

  const ctx = document.getElementById("sleepRiskChart");

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [
        {
          type: "bar",
          label: "Unen kesto (h)",
          data: sleep,
          backgroundColor: "rgba(34,197,94,0.6)",
          borderRadius: 6,
          yAxisID: "y"
        },
        {
          type: "line",
          label: "LF/HF Avg",
          data: lfhf,
          borderWidth: 3,
          tension: 0.4,
          fill: true,
          yAxisID: "y1",

          segment: {
            borderColor: ctx => getColor(ctx.p0.parsed.y)
          },

          backgroundColor: (context) => {
            const chart = context.chart;
            const { ctx, chartArea } = chart;
            if (!chartArea) return null;

            const value = context.dataset.data[context.dataIndex];
            const color = getColor(value);

            const rgb = hexToRgb(color);

            const grad = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
            grad.addColorStop(0, `rgba(${rgb},0.35)`);
            grad.addColorStop(1, `rgba(${rgb},0)`);

            return grad;
          },

          pointRadius: 3,
          pointBackgroundColor: "#3b82f6"
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      scales: {
        y: {
          min: 0,
          max: 12,
          title: { display: true, text: "Unen kesto" }
        },
        y1: {
          position: "right",
          grid: { display: false },
          suggestedMin: 0,
          suggestedMax: 2
        }
      }
    }
  });
}

function hexToRgb(hex) {
  const c = hex.replace("#","");
  const i = parseInt(c,16);
  return `${(i>>16)&255},${(i>>8)&255},${i&255}`;
}

document.querySelectorAll(".graph-period button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".graph-period button")
      .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    const days =
      btn.dataset.period === "30d" ? 30 :
      btn.dataset.period === "90d" ? 90 :
      btn.dataset.period === "365d" ? 365 : 7;

    updateChart(days);
  };
});

function logout() {
  localStorage.removeItem("token");
  location.href = "index.html";
}

init();
</script>

</body>
</html>
